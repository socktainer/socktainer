name: release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  XCODE_VERSION: "26.6"
  GO_VERSION: "1.26.5"

jobs:
  quality:
    name: Validate source and tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install build and validation dependencies
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install actionlint lld shellcheck xz

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Guest/go.sum

      - name: Validate tag and source
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          test "v${version}" = "${RELEASE_TAG}"
          scripts/release/validate-version.sh "${version}"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          git fetch --no-tags origin main
          tag_commit=$(git rev-list -n 1 "${RELEASE_TAG}")
          git merge-base --is-ancestor "${tag_commit}" origin/main
          scripts/release/release-notes.sh "${version}" CHANGELOG.md > /tmp/release-notes.md

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

      - name: Test Swift and release tools
        run: |
          make test
          make release-tools-test
          make shellcheck
          make actionlint

      - name: Test guest agent
        working-directory: Guest
        run: |
          go test -race ./...
          go vet ./...

      - name: Test VMM build and helper
        run: make -C VMM test

      - name: Test installer structure
        run: make installer-test

  build:
    name: Build, sign, and notarize
    needs: quality
    runs-on: [self-hosted, macOS, ARM64, glassdock-vmm-builder]
    timeout-minutes: 90
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install build and validation dependencies
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install actionlint lld shellcheck xz

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Guest/go.sum

      - name: Validate exact tagged source
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          scripts/release/validate-version.sh "${version}"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${RELEASE_TAG}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Import Developer ID identities
        env:
          APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain=${RUNNER_TEMP}/glassdock-signing.keychain-db
          keychain_password=$(openssl rand -hex 32)
          echo "SIGNING_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' \
            > "${RUNNER_TEMP}/prior-keychains"
          printf '%s' "${APPLICATION_P12}" | base64 --decode > "${RUNNER_TEMP}/application.p12"
          printf '%s' "${INSTALLER_P12}" | base64 --decode > "${RUNNER_TEMP}/installer.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 7200 "${keychain}"
          security import "${RUNNER_TEMP}/application.p12" -k "${keychain}" \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security import "${RUNNER_TEMP}/installer.p12" -k "${keychain}" \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${keychain_password}" "${keychain}"
          existing=()
          while IFS= read -r item; do
            existing+=("${item}")
          done < "${RUNNER_TEMP}/prior-keychains"
          security list-keychains -d user -s "${keychain}" "${existing[@]}"
          rm -f "${RUNNER_TEMP}/application.p12" "${RUNNER_TEMP}/installer.p12"

      - name: Prepare notarization key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_path=${RUNNER_TEMP}/AuthKey.p8
          printf '%s' "${API_KEY_P8}" | base64 --decode > "${key_path}"
          chmod 0600 "${key_path}"
          echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Build release artifacts
        env:
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          INSTALLER_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          make release-artifacts BUILD_VERSION="${version}" \
            CODESIGN_IDENTITY="${CODESIGN_IDENTITY}" \
            INSTALLER_SIGNING_IDENTITY="${INSTALLER_SIGNING_IDENTITY}"

      - name: Verify reproducible guest artifacts
        run: make -C Guest reproducibility-test

      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ env.RELEASE_TAG }}
          path: |
            pkginstaller/out/*.pkg
            pkginstaller/out/*.tar.gz
            pkginstaller/out/SHA256SUMS
            pkginstaller/out/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: |
          set +e
          if [ -f "${RUNNER_TEMP}/prior-keychains" ]; then
            prior=()
            while IFS= read -r item; do
              prior+=("${item}")
            done < "${RUNNER_TEMP}/prior-keychains"
            security list-keychains -d user -s "${prior[@]}"
          fi
          [ -z "${SIGNING_KEYCHAIN:-}" ] || security delete-keychain "${SIGNING_KEYCHAIN}"
          rm -f "${RUNNER_TEMP}/application.p12" "${RUNNER_TEMP}/installer.p12" \
            "${RUNNER_TEMP}/AuthKey.p8" "${RUNNER_TEMP}/prior-keychains"

  draft:
    name: Attest and create draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ env.RELEASE_TAG }}
          path: dist

      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.pkg
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/BUILD-METADATA.txt

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          scripts/release/release-notes.sh "${version}" CHANGELOG.md > release-notes.md
          prerelease=()
          case "${version}" in *-*) prerelease+=(--prerelease) ;; esac
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = true
            gh release upload "${RELEASE_TAG}" dist/* --clobber
            gh release edit "${RELEASE_TAG}" --draft --title "Glass Dock ${version}" \
              --notes-file release-notes.md "${prerelease[@]}"
          else
            gh release create "${RELEASE_TAG}" dist/* --verify-tag --draft \
              --title "Glass Dock ${version}" --notes-file release-notes.md \
              "${prerelease[@]}"
          fi
