name: pr-check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-release-${{ hashFiles('**/Package.resolved') }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      - name: Display swift version
        run: |
          which swift
          swift --version

      - name: Display Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path

      - name: Run Build
        timeout-minutes: 40
        run: make release

      - name: List Build
        run: ls -la ./.build/arm64-apple-macosx/release/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: socktainer
          path: ./.build/arm64-apple-macosx/release/socktainer

  tests-lint-format:
    name: formatters & tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: Guest/go.mod
          cache-dependency-path: Guest/go.sum

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-debug-${{ hashFiles('**/Package.resolved') }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      - name: Display swift version
        run: |
          which swift
          swift --version

      - name: Display Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path

      - name: Run formatter
        run: make fmt

      # Check we don't have changes in git
      - name: Check no changes in git
        run: |
          if ! git diff --exit-code; then
            echo "Found changes in git"
            exit 1
          fi

      - name: Execute test
        run: make test

      - name: Test guest agent
        run: |
          cd Guest
          go test -race ./...
          go vet ./...

  integration-test:
    name: integration test
    needs: build
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: Guest/go.mod
          cache-dependency-path: Guest/go.sum

      # fetch the artifact from the build job
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: socktainer

      - name: List downloaded artifact
        run: |
          ls -la
          chmod 755 socktainer

      - name: fetch apple container
        run: |
          APPLE_CONTAINER_VERSION=$(python3 -c "import json; d=json.load(open('Package.resolved')); print([p['state']['version'] for p in d['pins'] if p['identity']=='container'][0])")
          wget "https://github.com/apple/container/releases/download/${APPLE_CONTAINER_VERSION}/container-installer-unsigned.pkg" \
            -O container-installer-signed.pkg

      - name: install apple container
        run: sudo installer -pkg container-installer-signed.pkg -target / -verbose

      # `container system start` writes the apiserver launchd plist, then
      # bootstraps it via a launchctl call whose output and exit status it
      # discards (ServiceManager.register in apple/container). It derives the
      # target domain from `launchctl managername` + getuid(): under sudo in
      # a CI session that yields a domain like user/0 that can't be
      # bootstrapped into, so the registration silently fails and start dies
      # at "Testing access to container-apiserver" with an XPC error. tmate
      # was used here to work around that by providing a session whose
      # computed domain happened to work, but tmate is deprecated in Homebrew
      # (disabled 2026-12-11). Instead: when the first start fails, it has
      # already written the plist - bootstrap it into the system domain
      # ourselves (Mach lookups chain gui -> user -> system, so a
      # system-domain service is reachable from any session; the plist's
      # LimitLoadToSessionType allows System), then re-run start, which now
      # passes its ping and completes the init-filesystem and kernel setup
      # it skips on failure. Gated on the first start failing so an eventual
      # upstream fix doesn't turn the bootstrap into a spurious "already
      # bootstrapped" error.
      - name: Start container system
        run: |
          if ! sudo container system start --enable-kernel-install; then
            PLIST="$(sudo find /var/root "$HOME" -maxdepth 6 \
              -path '*/com.apple.container/apiserver/apiserver.plist' 2>/dev/null | head -1)"
            [ -n "$PLIST" ] || { echo "apiserver.plist not found" >&2; exit 1; }
            sudo launchctl bootstrap system "$PLIST"
            sudo container system start --enable-kernel-install
          fi
          sudo container system status

      - name: install docker cli
        run: brew install docker

      - name: Build and install the complete product
        run: |
          mkdir -p .build/release
          cp socktainer .build/release/socktainer
          sudo env PATH="$PATH" make -C Guest image
          make -C pkginstaller BUILD_VERSION=0.0.0-dev pkginstaller
          sudo installer -pkg pkginstaller/out/socktainer-installer.pkg -target /
          test -x /opt/socktainer/bin/socktainer
          test -s /opt/socktainer/share/socktainer/socktainer-guest.oci.tar

      - name: Run release integration
        run: |
          sudo -i sh -c 'nohup /opt/socktainer/bin/socktainer --no-check-compatibility --no-docker-context >/tmp/socktainer.log 2>&1 & echo $! >/tmp/socktainer.pid'
          for _ in {1..600}; do
            sudo test -S /var/root/.socktainer/container.sock && break
            sleep 0.1
          done
          sudo test -S /var/root/.socktainer/container.sock
          sudo -i env DOCKER_HOST=unix:///var/root/.socktainer/container.sock \
            bash "$GITHUB_WORKSPACE/scripts/integration-runtime.sh"

      - name: Verify restart and crash recovery
        run: |
          export DOCKER_HOST=unix:///var/root/.socktainer/container.sock
          IMAGE='docker.io/library/alpine@sha256:2c9d26f410d032d5b1525aa8a873e238b05b90c4ae8618743d4311f0cc827e37'
          sudo -E docker create --name restart-created "$IMAGE" /bin/true >/dev/null
          sudo kill -TERM "$(sudo cat /tmp/socktainer.pid)"
          for _ in {1..300}; do
            sudo kill -0 "$(sudo cat /tmp/socktainer.pid)" 2>/dev/null || break
            sleep 0.1
          done
          sudo -i sh -c 'nohup /opt/socktainer/bin/socktainer --no-check-compatibility --no-docker-context >/tmp/socktainer.log 2>&1 & echo $! >/tmp/socktainer.pid'
          for _ in {1..600}; do sudo -E docker ping >/dev/null 2>&1 && break; sleep 0.1; done
          test "$(sudo -E docker inspect --format '{{.State.Status}}' restart-created)" = created
          sudo -E docker start restart-created >/dev/null
          test "$(sudo -E docker wait restart-created)" = 0
          sudo -E docker rm restart-created >/dev/null
          sudo -E docker run -d --name restart-running "$IMAGE" sh -c 'while :; do sleep 1; done' >/dev/null
          sudo kill -KILL "$(sudo cat /tmp/socktainer.pid)"
          sudo -i sh -c 'nohup /opt/socktainer/bin/socktainer --no-check-compatibility --no-docker-context >/tmp/socktainer.log 2>&1 & echo $! >/tmp/socktainer.pid'
          for _ in {1..600}; do sudo -E docker ping >/dev/null 2>&1 && break; sleep 0.1; done
          test "$(sudo -E docker inspect --format '{{.State.Status}}' restart-running)" = exited
          sudo -E docker rm restart-running >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: socktainer-installer
          path: ./pkginstaller/out/socktainer-installer.pkg

      - name: Show service log on failure
        if: failure()
        run: sudo cat /tmp/socktainer.log || true
